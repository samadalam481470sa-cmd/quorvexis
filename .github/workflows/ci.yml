name: Build and security checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/api/requirements.txt
      - run: PYTHONPATH=apps/api ruff check --select E4,E7,E9,F63,F7,F82 apps/api/app apps/api/tests
      - run: PYTHONPATH=apps/api JWT_SECRET=testing-only-secret-not-for-production-use pytest -q apps/api/tests
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Compose configuration
        env:
          JWT_SECRET: ci-only-example-secret-not-for-production
          POSTGRES_PASSWORD: ci-url-safe-local-example
        run: docker compose config --quiet
